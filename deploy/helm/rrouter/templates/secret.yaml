{{- if and .Values.admin.value (not .Values.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrouter.fullname" . }}-admin
  labels:
    {{- include "rrouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ .Values.admin.value | quote }}
{{- end }}
{{- if and .Values.masterKey.value (not .Values.masterKey.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrouter.fullname" . }}-master
  labels:
    {{- include "rrouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ .Values.masterKey.value | quote }}
{{- end }}
