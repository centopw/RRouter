[workspace]
resolver = "2"
members = [
    "crates/rrouter-rtk",
    "crates/rrouter-core",
    "crates/rrouter-translate",
    "crates/rrouter-auth",
    "crates/rrouter-store",
    "crates/rrouter-router",
    "crates/rrouter-gateway",
    "crates/rrouter-ui",
]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/centopw/RRouter"

[workspace.dependencies]
rrouter-rtk = { path = "crates/rrouter-rtk" }
rrouter-core = { path = "crates/rrouter-core" }
rrouter-translate = { path = "crates/rrouter-translate" }
rrouter-auth = { path = "crates/rrouter-auth" }
rrouter-store = { path = "crates/rrouter-store" }
rrouter-router = { path = "crates/rrouter-router" }
rrouter-gateway = { path = "crates/rrouter-gateway" }
rrouter-ui = { path = "crates/rrouter-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "process"] }
tokio-stream = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
http = "1"
axum = { version = "0.8", features = ["json", "query", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
hex = "0.4"
hmac = "0.12"
# HS256 only (gateway auth sessions): select the AWS-LC backend and drop the default
# `use_pem` feature so the RustCrypto RSA stack (rsa, crypto-bigint) is never compiled.
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
digest = "0.10"
# Optional OpenTelemetry export (feature `otel`, default off). Kept in the workspace
# table so the gateway can opt in without duplicating version pins; nothing here is
# compiled unless `rrouter-gateway` enables the feature.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"
argon2 = "0.5"
jiff = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false
strip = "symbols"
