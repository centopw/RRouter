version: 2
# Weekly dependency updates, grouped so one PR moves one ecosystem.
#
# Major versions are ignored for Rust and the dashboard on purpose: this gateway pins
# protocol behaviour (rand, reqwest, axum, vite) and a grouped major bump is a deliberate
# migration, not a chore. Security fixes still arrive through minor/patch updates and the
# advisory databases (`cargo audit`, `npm audit`).
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
