name: docker

# Builds the image on every change and publishes multi-arch tags to GHCR on
# main and on version tags. Pull requests build without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Tags must always publish; a newer commit supersedes older branch builds.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Proves the published image is actually runnable: distroless has no shell, so the
  # only way to know the entrypoint, the writable /data volume and the built-in
  # healthcheck work is to start the image and probe it.
  smoke:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build a local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rrouter:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run, probe, and check the volume is writable
        run: |
          docker run -d --name rrouter-smoke \
            -p 20128:20128 -v rrouter-smoke:/data \
            -e RROUTER_ALLOW_REMOTE_ADMIN=true \
            rrouter:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:20128/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:20128/health
          # A healthy server proves the SQLite file and master key were written to the
          # volume: the container has no shell to inspect it with.
          docker exec rrouter-smoke /usr/local/bin/rrouter --healthcheck
      - name: Cleanup
        if: always()
        run: docker rm -f rrouter-smoke || true
