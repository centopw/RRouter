name: docker

# Native per-architecture builds (no QEMU): amd64 runs on ubuntu-latest, arm64 on
# ubuntu-24.04-arm. Each leg pushes an image by digest; one merge job assembles the
# multi-arch tags with `docker buildx imagetools create`. Pull requests build without
# pushing and skip the merge.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Tags must always publish; a newer commit supersedes older branch builds.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release binary for the live smokes
        run: cargo build --release --locked
      - name: Live end-to-end smoke (mock upstream + real binary)
        run: python3 scripts/e2e_smoke.py
      - name: OAuth smoke (mock identity provider)
        run: python3 scripts/oauth_smoke.py
      - name: Backup/restore drill
        run: python3 scripts/backup_restore_smoke.py

  # One native builder per architecture. `provenance: false` keeps buildx from minting a
  # second attestation per digest; the release workflow's binary provenance is the
  # artifact trust root, and the merge job re-tags the exact digests.
  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR paths are lowercase. GitHub's repository name keeps its original case
      # (`centopw/RRouter`), which is not a valid registry reference.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests still prove the image builds for both architectures, but never
      # push and never merge a manifest.
      - name: Build (pull request, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: rrouter:pr-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Push one platform by digest only; the merge job adds the human tags.
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          [ -n "$digest" ] || { echo "buildx returned no digest" >&2; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One writer for the manifest list: both architectures must be present, so a partially
  # pushed release can never become `latest`.
  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          [ "${#tags[@]}" -gt 0 ] || { echo "metadata produced no tags" >&2; exit 1; }
          args=()
          for tag in "${tags[@]}"; do args+=("-t" "$tag"); done
          count=0
          for digest in /tmp/digests/*; do
            args+=("${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "$digest")")
            count=$((count + 1))
          done
          [ "$count" -eq 2 ] || { echo "expected 2 platform digests, got $count" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          first="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$first"

  # Proves the published image is actually runnable: distroless has no shell, so the
  # only way to know the entrypoint, the writable /data volume and the built-in
  # healthcheck work is to start the image and probe it. The amd64 GHA cache scope is
  # shared with the image matrix, so this is a cache-hit rebuild rather than a second
  # full release compile.
  smoke:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build a local image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rrouter:smoke
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false
      - name: Run, probe, and check the volume is writable
        run: |
          docker run -d --name rrouter-smoke \
            -p 20128:20128 -v rrouter-smoke:/data \
            -e RROUTER_ALLOW_REMOTE_ADMIN=true \
            rrouter:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:20128/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:20128/health
          # A healthy server proves the SQLite file and master key were written to the
          # volume: the container has no shell to inspect it with.
          docker exec rrouter-smoke /usr/local/bin/rrouter --healthcheck
      - name: Cleanup
        if: always()
        run: docker rm -f rrouter-smoke || true
