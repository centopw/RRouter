name: release

# Tagged builds: the installer downloads these tarballs and verifies their `.sha256`
# before installing. Every release also carries a CycloneDX SBOM per artifact and a
# GitHub build-provenance attestation; see docs/RELEASES.md for what that proves.
#
# A tag rebuilds nothing CI already built:
#
#   ui ─► binaries (4 legs, parallel) ─┐
#   gate (waits for CI on the commit) ─┼─► publish (notes, attest, upload) ─► verify
#                                  └─► image  (re-tag the CI image: version, major.minor)
#
# The binaries compile while CI runs, so the release is ready roughly when CI finishes. The
# release body is written once from CHANGELOG.md by `publish`; the matrix legs only hand
# files to it, so four legs cannot publish four bodies.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish (required for a re-run)"
        required: false

permissions:
  contents: write

env:
  REGISTRY: ghcr.io

jobs:
  # One place decides which tag this run publishes; every later job reads its outputs.
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Validate the tag
        id: tag
        # workflow_dispatch needs an explicit v* tag; a branch name would publish a
        # release nobody can install from.
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "publish needs a v* tag, got '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # `github.sha` is the event's commit; on a workflow_dispatch re-run that is the
      # branch head, not the tag. Everything below is about the tagged commit.
      - name: Resolve the tagged commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The release binaries embed `ui/dist`. The committed bundle is only a convenience for a
  # plain `cargo build` (Vite's hashes differ between machines, so it cannot be checked for
  # freshness), so the release builds the dashboard itself, once, and hands it to every leg.
  ui:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  binaries:
    needs: [prepare, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: darwin-arm64
          # Cross-compiled on the arm64 runner: the Apple SDK ships both arches, and
          # macOS 13 (the last Intel image) is retired.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: darwin-amd64
    runs-on: ${{ matrix.runner }}
    # A leg compiles and packages; it can write nothing to the release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # A re-run for an old tag must build that tag, not the branch it is dispatched
          # from — otherwise the provenance would name the wrong source.
          ref: ${{ needs.prepare.outputs.tag }}

      # Replaces the committed bundle with this tag's own build.
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache downloaded crates only. Restoring compiled `target/` output would let a
          # poisoned cache reach a signed release artifact.
          cache-targets: "false"
          save-if: "false"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        # Artifact names and `.sha256` layout are a contract with install.sh: do not
        # rename them.
        run: |
          set -eu
          name="rrouter-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rrouter" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: SBOM (CycloneDX 1.5)
        # Deterministic and generated from the tag's Cargo.lock, so the published file can
        # be re-derived from the source (see the `verify` job).
        run: |
          python3 scripts/sbom.py \
            --artifact "rrouter-${{ matrix.asset }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${{ needs.prepare.outputs.sha }}" \
            --output "dist/rrouter-${{ matrix.asset }}.tar.gz.sbom.cdx.json"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/rrouter-${{ matrix.asset }}.tar.gz
            dist/rrouter-${{ matrix.asset }}.tar.gz.sha256
            dist/rrouter-${{ matrix.asset }}.tar.gz.sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  # A tag publishes only a commit CI already passed. It runs beside the builds, so it
  # costs no extra wall time when CI is quick.
  gate:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/wait_for_ci.sh "${{ needs.prepare.outputs.sha }}"

  # CI already built, smoke-tested and pushed this commit's multi-arch image as
  # `sha-<short>`. Giving it the version tags is a manifest copy, not a rebuild.
  image:
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the CI image with the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          src="${image}:sha-${SHA::7}"
          majmin="$(echo "$VERSION" | cut -d. -f1,2)"
          docker buildx imagetools inspect "$src" >/dev/null \
            || { echo "no CI image $src: the tagged commit was never built on main" >&2; exit 1; }
          docker buildx imagetools create -t "${image}:${VERSION}" -t "${image}:${majmin}" "$src"
          docker buildx imagetools inspect "${image}:${VERSION}"

  # The only job that writes the release: notes, provenance and assets, in one place.
  publish:
    needs: [prepare, binaries, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # `release.py --check` needs the tag it is validating and the commits behind it.
          fetch-depth: 0

      - name: Validate release metadata at the tag
        run: python3 scripts/release.py --check

      - name: Validate CHANGELOG notes (dry run)
        run: python3 scripts/release-notes.py "${{ needs.prepare.outputs.tag }}" --check

      - name: Render release notes
        run: |
          set -eu
          python3 scripts/release-notes.py "${{ needs.prepare.outputs.tag }}" > .release-notes.md
          test -s .release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Check every asset is present
        run: |
          set -eu
          for a in linux-amd64 linux-arm64 darwin-arm64 darwin-amd64; do
            for ext in tar.gz tar.gz.sha256 tar.gz.sbom.cdx.json; do
              test -s "dist/rrouter-$a.$ext" || { echo "missing dist/rrouter-$a.$ext" >&2; exit 1; }
            done
          done

      # Binds each downloadable tarball to this workflow, repository, commit and tag.
      # `gh attestation verify` is the documented way to check it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/rrouter-*.tar.gz

      - name: Create or update the release once
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: .release-notes.md
          # The body comes from CHANGELOG.md; GitHub's auto-generated list would append a
          # second copy.
          generate_release_notes: false
          # Assets are attached by name and replaced on a re-run.
          overwrite_files: true
          files: dist/*

  # Post-publish check: verify what users actually download, not what the build workspace
  # happened to contain. A missing or swapped asset fails the workflow here.
  verify:
    needs: [prepare, publish, image]
    runs-on: ubuntu-24.04
    permissions:
      # Read-only: download the release assets and read the attestation store.
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--commit` proves each SBOM is byte-identical to one generated from this tag.
        # On a workflow_dispatch re-run the provenance statement's source ref is the
        # dispatch commit (a GitHub limitation); a tag push is the authoritative path.
        run: |
          bash scripts/verify-release.sh "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)"
