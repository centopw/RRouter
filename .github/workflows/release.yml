name: release

# Tagged builds: the installer downloads these tarballs and verifies their `.sha256`
# before installing. Every release also carries a CycloneDX SBOM per artifact and a
# GitHub build-provenance attestation; see docs/RELEASES.md for what that proves.
#
# The release body is written ONCE from CHANGELOG.md by `create-release`; the matrix legs
# only attach files to that existing release, so four legs cannot publish four bodies or
# four duplicated "Full Changelog" blocks.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish (required for a re-run)"
        required: false

permissions:
  contents: write

jobs:
  # One place decides which tag this run publishes; every later job reads its outputs.
  prepare:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate the tag
        id: tag
        # workflow_dispatch needs an explicit v* tag; a branch name would publish a
        # release nobody can install from.
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "publish needs a v* tag, got '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # The only job that writes the release body. It runs before the binaries so the
  # release exists when the matrix uploads assets, and a notes failure stops the publish
  # before any artifact is attached.
  create-release:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Validate CHANGELOG notes (dry run)
        run: python3 scripts/release-notes.py "${{ needs.prepare.outputs.tag }}" --check

      - name: Render release notes
        run: |
          set -eu
          python3 scripts/release-notes.py "${{ needs.prepare.outputs.tag }}" > .release-notes.md
          test -s .release-notes.md

      - name: Create or update the release once
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: .release-notes.md
          # The body comes from CHANGELOG.md; GitHub's auto-generated comparison list
          # would append a second, per-leg copy and duplicate it on every matrix run.
          generate_release_notes: false

  binaries:
    needs: [prepare, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: darwin-arm64
          # Cross-compiled on the arm64 runner: the Apple SDK ships both arches, and
          # macOS 13 (the last Intel image) is retired.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: darwin-amd64
    runs-on: ${{ matrix.runner }}
    # Least privilege: the release upload, the OIDC token for attestation signing, and
    # the attestation store. Nothing else is granted to a job that runs build scripts.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A re-run for an old tag must build that tag, not the branch it is dispatched
          # from — otherwise the provenance would name the wrong source.
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Resolve source commit
        id: source
        # `github.sha` is the event's commit; on a workflow_dispatch re-run that is the
        # branch head, not the tag. The SBOM must describe what was actually built.
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache downloaded crates only. Restoring compiled `target/` output would let a
          # poisoned cache reach a signed release artifact.
          cache-targets: "false"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        # Artifact names and `.sha256` layout are a contract with install.sh: do not
        # rename them.
        run: |
          set -eu
          name="rrouter-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rrouter" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: SBOM (CycloneDX 1.5)
        # Deterministic and generated from the tag's Cargo.lock, so the published file can
        # be re-derived from the source (see the `verify` job).
        run: |
          python3 scripts/sbom.py \
            --artifact "rrouter-${{ matrix.asset }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${{ steps.source.outputs.commit }}" \
            --output "dist/rrouter-${{ matrix.asset }}.tar.gz.sbom.cdx.json"

      - name: Attest build provenance
        # Binds each downloadable file to this workflow, repository, commit and tag.
        # `gh attestation verify` is the documented way to check it.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/rrouter-${{ matrix.asset }}.tar.gz

      - name: Upload assets to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # `gh release upload` attaches files only: it never touches the body that
        # `create-release` already wrote. `--clobber` makes a re-run idempotent.
        run: |
          set -eu
          gh release upload "$TAG" \
            "dist/rrouter-${{ matrix.asset }}.tar.gz" \
            "dist/rrouter-${{ matrix.asset }}.tar.gz.sha256" \
            "dist/rrouter-${{ matrix.asset }}.tar.gz.sbom.cdx.json" \
            --clobber

  # Post-publish check: verify what users actually download, not what the build workspace
  # happened to contain. A missing or swapped asset fails the workflow here.
  verify:
    needs: [prepare, binaries]
    runs-on: ubuntu-24.04
    permissions:
      # Read-only: download the release assets and read the attestation store.
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--commit` proves each SBOM is byte-identical to one generated from this tag.
        # On a workflow_dispatch re-run the provenance statement's source ref is the
        # dispatch commit (a GitHub limitation); a tag push is the authoritative path.
        run: |
          bash scripts/verify-release.sh "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)"
