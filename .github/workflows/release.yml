name: release

# Tagged builds: the installer script downloads these tarballs, and their
# sha256 files are what it verifies before installing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for a re-run)"
        required: false

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: darwin-arm64
          # Cross-compiled on the arm64 runner: the Apple SDK ships both arches, and
          # macOS 13 (the last Intel image) is retired.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require a tag
        # workflow_dispatch needs an explicit tag; a branch name would publish a
        # release nobody can install from.
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "publish needs a v* tag, got '$tag'" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          name="rrouter-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rrouter" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/rrouter-${{ matrix.asset }}.tar.gz
            dist/rrouter-${{ matrix.asset }}.tar.gz.sha256
          generate_release_notes: true
