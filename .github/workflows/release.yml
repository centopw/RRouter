name: release

# Tagged builds: the installer downloads these tarballs and verifies their `.sha256`
# before installing. Every release also carries a CycloneDX SBOM per artifact and a
# GitHub build-provenance attestation; see docs/RELEASES.md for what that proves.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for a re-run)"
        required: false

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: darwin-arm64
          # Cross-compiled on the arm64 runner: the Apple SDK ships both arches, and
          # macOS 13 (the last Intel image) is retired.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: darwin-amd64
    runs-on: ${{ matrix.runner }}
    # Least privilege: the release upload, the OIDC token for attestation signing, and
    # the attestation store. Nothing else is granted to a job that runs build scripts.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require a tag
        id: tag
        # workflow_dispatch needs an explicit tag; a branch name would publish a
        # release nobody can install from.
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "publish needs a v* tag, got '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # A re-run for an old tag must build that tag, not the branch it is dispatched
          # from — otherwise the provenance would name the wrong source.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve source commit
        id: source
        # `github.sha` is the event's commit; on a workflow_dispatch re-run that is the
        # branch head, not the tag. The SBOM must describe what was actually built.
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache downloaded crates only. Restoring compiled `target/` output would let a
          # poisoned cache reach a signed release artifact.
          cache-targets: "false"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        # Artifact names and `.sha256` layout are a contract with install.sh: do not
        # rename them.
        run: |
          set -eu
          name="rrouter-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rrouter" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: SBOM (CycloneDX 1.5)
        # Deterministic and generated from the tag's Cargo.lock, so the published file can
        # be re-derived from the source (see the `verify` job).
        run: |
          python3 scripts/sbom.py \
            --artifact "rrouter-${{ matrix.asset }}" \
            --version "${{ steps.tag.outputs.version }}" \
            --commit "${{ steps.source.outputs.commit }}" \
            --output "dist/rrouter-${{ matrix.asset }}.tar.gz.sbom.cdx.json"

      - name: Attest build provenance
        # Binds each downloadable file to this workflow, repository, commit and tag.
        # `gh attestation verify` is the documented way to check it.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/rrouter-${{ matrix.asset }}.tar.gz

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/rrouter-${{ matrix.asset }}.tar.gz
            dist/rrouter-${{ matrix.asset }}.tar.gz.sha256
            dist/rrouter-${{ matrix.asset }}.tar.gz.sbom.cdx.json
          generate_release_notes: true

  # Post-publish check: verify what users actually download, not what the build workspace
  # happened to contain. A missing or swapped asset fails the workflow here.
  verify:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      # Read-only: download the release assets and read the attestation store.
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--commit` proves each SBOM is byte-identical to one generated from this tag.
        # On a workflow_dispatch re-run the provenance statement's source ref is the
        # dispatch commit (a GitHub limitation); a tag push is the authoritative path.
        run: |
          bash scripts/verify-release.sh "${{ github.event.inputs.tag || github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)"
