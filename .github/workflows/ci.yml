name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rustfmt is its own gate now: the tree is clean today, and a formatting drift
          # should fail the same job that compiles it.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked

  # Dependency advisories. The lockfile is clean as of this commit (252 crates against
  # the full RustSec database), so this is a real gate, not aspirational: a newly
  # published advisory fails the PR and is fixed by bumping the crate, or — only when no
  # fixed version exists — by an `audit.toml` `[advisories] ignore` entry with a review
  # date in the comment. Do not add an ignore list pre-emptively.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run build
        working-directory: ui

  # One version source: Cargo.toml. The release tool writes every derived carrier
  # (Cargo.lock, README, Helm appVersion, roadmap, Helm guide) and this gate fails a PR
  # that lets them drift or cuts a version without a CHANGELOG section.
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check version carriers and CHANGELOG notes
        run: python3 scripts/release.py --check

  # Static validation of the workflows themselves. Runs the upstream actionlint image
  # (pinned) so a bad expression, unknown runner/context or shell mistake fails PRs
  # before a tag is cut.
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
