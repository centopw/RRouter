name: CI

# One pipeline per commit. Everything below runs in parallel; nothing is built twice.
#
#   lint ─┐
#   clippy ┤
#   test ──┤
#   e2e ───┼──► publish   (push to main only: moves sha-/main/latest to the new image)
#   audit ─┤
#   dashboard ┤
#   image ─┘    (native amd64 + arm64, pushed by digest; no tag moves until the rest is green)
#
# A `v*` tag does not rebuild anything: release.yml waits for this workflow on the tagged
# commit, then re-tags the image this workflow already built (see docs/RELEASES.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes an older PR/branch run. Runs on main always finish: a release
  # tag waits for this workflow on its exact commit, so it must not be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are useless on a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0
  REGISTRY: ghcr.io

jobs:
  # Seconds-long static gates share one runner instead of paying startup three times.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # One version source: Cargo.toml. Fails a PR that lets a derived carrier drift or
      # cuts a version without a CHANGELOG section.
      - name: Check version carriers and CHANGELOG notes
        run: python3 scripts/release.py --check
      # Static validation of the workflows themselves (pinned upstream image).
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # clippy and the tests compile different profiles, so they cannot share work; running
  # them on separate runners makes the wall time the slower of the two, not the sum.
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          # Only main writes the cache; PRs read it. Keeps one warm cache instead of a
          # fresh one per PR evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # The real release binary against a mock upstream, a mock identity provider and a
  # backup/restore drill. This used to run inside the docker workflow after the unit
  # tests; it needs only a release build, so it runs alongside everything else.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked
      - name: Live end-to-end smoke (mock upstream + real binary)
        run: python3 scripts/e2e_smoke.py
      - name: OAuth smoke (mock identity provider)
        run: python3 scripts/oauth_smoke.py
      - name: Backup/restore drill
        run: python3 scripts/backup_restore_smoke.py

  # Dependency advisories. The lockfile is clean (252 crates against the full RustSec
  # database), so this is a real gate: a newly published advisory fails the PR and is
  # fixed by bumping the crate, or — only when no fixed version exists — by an
  # `audit.toml` `[advisories] ignore` entry with a review date in the comment.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # The served bundle is committed, and cargo embeds it without Node. A UI change
      # that forgot to rebuild it would ship the old dashboard in every release tarball.
      - name: Committed bundle is current
        run: |
          if [ -n "$(git status --porcelain -- ui/dist)" ]; then
            git status --short -- ui/dist >&2
            echo "ui/dist is stale: run 'npm run build' in ui/ and commit the result" >&2
            exit 1
          fi

  # One native builder per architecture (no QEMU). Pull requests build amd64 only and
  # never push; main builds both and pushes each by digest. Pushing a digest moves no tag,
  # so an image from a commit that later fails a gate is unreachable by name.
  image:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"}]}' || '{"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}]}') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR paths are lowercase; the repository name keeps its original case.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # `provenance: false` keeps buildx from minting a second attestation per digest.
      # Only main writes the layer cache, so PR builds cannot evict it.
      - name: Build (pull request, load only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: rrouter:pr
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: false

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      # The runnable-image check (entrypoint, writable /data, built-in healthcheck) uses
      # the image just built, not a second compile. Distroless has no shell, so the only
      # proof is to start it. Native runner per arch, so both architectures are proven.
      - name: Smoke the built image
        env:
          PUSHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref=rrouter:pr
          else
            [ -n "$PUSHED_DIGEST" ] || { echo "buildx returned no digest" >&2; exit 1; }
            ref="${REGISTRY}/${IMAGE_NAME}@${PUSHED_DIGEST}"
            docker pull --quiet "$ref"
          fi
          sh scripts/image_smoke.sh "$ref"

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The single writer of image tags on main. It needs every gate and both digests, so a
  # partially built or untested commit can never become `latest`. release.yml re-tags
  # `sha-<short>` to the version when a tag lands on this commit.
  publish:
    needs: [lint, clippy, test, e2e, audit, dashboard, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create the multi-arch manifest
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          args=(-t "${image}:sha-${GITHUB_SHA::7}" -t "${image}:main" -t "${image}:latest")
          count=0
          for digest in /tmp/digests/*; do
            args+=("${image}@sha256:$(basename "$digest")")
            count=$((count + 1))
          done
          [ "$count" -eq 2 ] || { echo "expected 2 platform digests, got $count" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA::7}"
