[package]
name = "rrouter-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# OTLP/HTTP span export. Off by default: the default build has no OpenTelemetry
# dependency at all (asserted by `tests/otel.rs` and CI).
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[[bin]]
name = "rrouter"
path = "src/main.rs"

[dependencies]
rrouter-core.workspace = true
rrouter-rtk.workspace = true
rrouter-translate.workspace = true
rrouter-auth.workspace = true
rrouter-store.workspace = true
rrouter-router.workspace = true
rrouter-ui.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
rusqlite.workspace = true
jsonwebtoken.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
