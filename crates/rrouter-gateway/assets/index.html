<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRouter</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="brand" id="brand">RRouter</div>
    <nav id="tabs" class="sidebar-nav" aria-label="Dashboard panels"></nav>
    <div class="sidebar-spacer"></div>
    <div id="health" class="health-status" role="status" aria-live="polite" title="live /health">
      <span class="health-dot" aria-hidden="true"></span>
      <span id="health-label">…</span>
    </div>
  </aside>
  <div id="sidebar-scrim" class="scrim" aria-hidden="true"></div>
  <main class="workspace">
    <header class="content-header">
      <button id="menu-button" class="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
      <h1 id="panel-title">RRouter</h1>
      <div id="panel-actions" class="panel-actions"></div>
    </header>
    <section id="panel" class="panel" role="tabpanel" tabindex="0" aria-labelledby="panel-title"></section>
    <footer class="bar foot"><span id="footer"></span></footer>
  </main>
</div>
<template id="tpl-table">
  <div class="toolbar" id="toolbar"></div>
  <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</template>
<script type="module" src="/app.js"></script>
</body>
</html>
